<html lang="ko">

<title>카 가챠 차고</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;800&display=swap">
<style>
/* 지하 주차장 B2 — 콘크리트 벽, 노란 주차선, 번호판 */
:root{
  --bg:#121417; --panel:#1b1e22; --line2:#2b2f35; --line:#f2c230; --ink:#ecebe6; --muted:#949aa3;
  --c:#9aa1aa; --r:#3f9bf0; --sr:#b072f5; --ssr:#ffae35;
  --display:"Black Han Sans","Gothic A1",system-ui,sans-serif; --body:"Gothic A1",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
.wrap{max-width:960px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0}
h1 span{color:var(--line)}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.pill small{color:var(--muted);font-size:12px}.pill b{color:var(--line);font-size:18px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:2px dashed var(--line2)}
.tab{background:none;border:0;color:var(--muted);font:800 15px var(--body);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--line);outline-offset:2px}
.stage{background:linear-gradient(180deg,#1b1e22 0 60%,#0d0f11 60%);border:1px solid var(--line2);border-radius:16px;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:40%;border-left:5px solid var(--line);border-right:5px solid var(--line);opacity:.5;pointer-events:none}
.car{width:min(420px,90%);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.car.in{animation:drive .7s cubic-bezier(.2,.8,.2,1)}
@keyframes drive{from{transform:translateX(-120%)}to{transform:none}}
.result{text-align:center;margin-top:10px;z-index:1}
.grade{display:inline-block;font:800 13px var(--body);padding:3px 10px;border-radius:999px;color:#111}
.name{font-family:var(--display);font-size:clamp(22px,4.5vw,32px);margin:8px 0 2px}
.meta{color:var(--muted);font-size:13px}
.new{color:var(--line);font-weight:800;margin-left:6px}
.plate{display:inline-block;background:#f6f6f1;color:#121212;border:2px solid #121212;border-radius:6px;padding:2px 12px;font:800 15px var(--body);letter-spacing:.06em;margin-top:8px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:14px 22px;font:800 16px var(--body);cursor:pointer;background:var(--line);color:#151515;box-shadow:0 4px 0 #a8861c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8861c}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #000;border:1px solid var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;margin-top:14px;z-index:1}
@media (max-width:560px){.ten{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel);border:1px solid var(--line2);border-top:4px solid var(--g);border-radius:10px;padding:8px;text-align:center;min-width:0}
.card svg,.card img{width:100%;height:auto;display:block;border-radius:6px}
.car img{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 12px 30px #0008}
.slot img{width:100%;aspect-ratio:7/5;object-fit:cover;display:block;border-radius:6px}
.card .n{font-size:12px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.card .g{font-size:11px;font-weight:800;color:var(--g)}
.rates{color:var(--muted);font-size:12px;text-align:center}
.dex-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--line);color:#151515;border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;min-width:0}
.slot.lock{opacity:.45}
.slot svg{width:100%;height:auto}
.slot .n{font-size:12px;font-weight:700;overflow-wrap:anywhere}
.slot .m{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.bar{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.car.in{animation:none}}
</style>
</head>

  </nav>

  <section id="p-draw">

      <div class="ten" id="ten" hidden></div>
    </div>
    <div class="btns" style="margin-top:14px">

    <p class="rates">C 55% · R 30% · SR 12% · SSR 3% · 10연차는 SR 이상 1대 확정 · 50회 안에 SSR 확정 · 중복은 코인으로 환급</p>
  </section>

  <section id="p-dex" hidden>

    </div>

</div>

쉐보레 말리부|쉐보레|2016|sedan|C

쉐보레 트레일블레이저|쉐보레|2020|suv|C

const CARS=RAW.trim().split("\n").map((l,i)=>{const[n,b,y,t,r]=l.split("|");return{id:i,name:n,brand:b,year:+y,type:t,rar:r}});
const WEIGHT={C:55,R:30,SR:12,SSR:3},REFUND={C:10,R:20,SR:60,SSR:200},GNAME={C:"커먼",R:"레어",SR:"슈퍼 레어",SSR:"스페셜 레어"};
const TYPE={sedan:"세단",suv:"SUV",hatch:"해치백",coupe:"쿠페",truck:"트럭",van:"밴·MPV",mini:"경차"};
const PITY=50;
const gc=r=>getComputedStyle(document.documentElement).getPropertyValue("--"+r.toLowerCase()).trim();
const $=id=>document.getElementById(id);
let S={coins:3000,own:{},pity:0};
try{const s=JSON.parse(localStorage.getItem("carGachaKR")||"null");if(s&&typeof s.coins==="number")S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem("carGachaKR",JSON.stringify(S))}catch(e){}};

// 차 옆모습 (사진 대신 차종별 실루엣)
const PAINT=["#e4e6ea","#1b1f25","#b3261e","#24519e","#f3f3ee","#6f7680","#2f5a3a","#d9a91f","#e8641a","#0f6f78","#8e1b3a"];
const CAB={sedan:"M52,40 L74,21 L128,21 L152,40",hatch:"M50,40 L70,19 L150,19 L166,40",suv:"M38,40 L52,12 L160,12 L170,40",coupe:"M62,40 L88,22 L124,22 L154,40",
 truck:"M36,40 L50,13 L98,13 L100,40",van:"M20,40 L34,8 L182,8 L186,40",mini:"M48,40 L62,14 L140,14 L152,40"};
function carSVG(c,color){const p=color||PAINT[(c.id*7)%PAINT.length],dark=p==="#1b1f25"||p==="#24519e"||p==="#8e1b3a";
 const cab=CAB[c.type]||CAB.sedan,mini=c.type==="mini";
 return `<svg viewBox="0 0 200 86" role="img" aria-label="${c.name}"><ellipse cx="100" cy="78" rx="88" ry="5" fill="#0006"/>
 <g transform="${mini?"translate(15,4) scale(.85)":""}">
 <path d="${cab} Z" fill="${p}" stroke="#0a0a0a" stroke-width="2.5"/>
 <path d="${cab} Z" fill="${dark?"#9fb4c8":"#2a3a4a"}" opacity=".85" transform="translate(100 30) scale(.86) translate(-100 -30)"/>
 <path d="M10,62 L10,48 Q12,41 32,40 L172,40 Q190,42 191,50 L191,62 Z" fill="${p}" stroke="#0a0a0a" stroke-width="2.5"/>
 ${c.type==="truck"?'<rect x="100" y="30" width="88" height="12" fill="'+p+'" stroke="#0a0a0a" stroke-width="2.5"/>':""}
 <rect x="182" y="46" width="8" height="5" rx="1" fill="#ffe9a0"/><rect x="11" y="46" width="6" height="5" rx="1" fill="#e0453a"/>
 <line x1="20" y1="54" x2="182" y2="54" stroke="#0004" stroke-width="2"/>
 <g fill="#151515" stroke="#0a0a0a" stroke-width="2"><circle cx="48" cy="64" r="14"/><circle cx="154" cy="64" r="14"/></g>
 <g fill="#9aa1aa"><circle cx="48" cy="64" r="6"/><circle cx="154" cy="64" r="6"/></g></g></svg>`}

// 차 사진 (id: 파일). 없으면 실루엣
const PHOTO={0:"img/avante-j1.jpg",1:"img/avante-j2.jpg",2:"img/avante-xd.jpg",3:"img/avante-hd.jpg",4:"img/avante-md.jpg",5:"img/avante-ad.jpg",6:"img/avante-cn7.jpg",7:"img/avante-cn8.jpg"};
const pic=(c,lock)=>!lock&&PHOTO[c.id]?`<img src="${PHOTO[c.id]}" alt="${c.name}" loading="lazy">`:carSVG(c,lock?"#3a3f46":null);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function hud(){$("coins").textContent=S.coins.toLocaleString();$("have").textContent=Object.keys(S.own).length;$("pity").textContent=S.pity;
 $("b1").disabled=S.coins<100;$("b10").disabled=S.coins<1000}

function rollRar(min){if(S.pity>=PITY-1)return"SSR";const pool=Object.entries(WEIGHT).filter(([r])=>!min||["SR","SSR"].includes(r));
 let x=Math.random()*pool.reduce((a,[,w])=>a+w,0);for(const[r,w]of pool){if((x-=w)<0)return r}return"C"}
function pull(min){const r=rollRar(min);S.pity=r==="SSR"?0:S.pity+1;const list=CARS.filter(c=>c.rar===r),c=list[Math.random()*list.length|0];
 const dup=!!S.own[c.id];S.own[c.id]=(S.own[c.id]||0)+1;if(dup)S.coins+=REFUND[r];return{c,dup}}

function showOne({c,dup}){$("ten").hidden=true;const g=gc(c.rar);
 $("single").innerHTML=`<div class="car in">${pic(c)}</div><div class="result"><span class="grade" style="background:${g}">${c.rar} · ${GNAME[c.rar]}</span>
 <div class="name">${esc(c.name)}${dup?"":'<span class="new">NEW</span>'}</div><div class="meta">${esc(c.brand)} · ${c.year}년 · ${TYPE[c.type]}${dup?" · 중복 +"+REFUND[c.rar]+"코인":""}</div>
 <div class="plate">${String(c.id+1).padStart(3,"0")}가 ${String(1000+c.year%9000).slice(-4)}</div></div>`}
function showTen(rs){$("single").innerHTML="";const t=$("ten");t.hidden=false;
 t.innerHTML=rs.map(({c,dup})=>`<div class="card" style="--g:${gc(c.rar)}">${pic(c)}<div class="g">${c.rar}${dup?"":" · NEW"}</div><div class="n">${esc(c.name)}</div></div>`).join("")}

$("b1").onclick=()=>{if(S.coins<100)return;S.coins-=100;showOne(pull());save();hud()};
$("b10").onclick=()=>{if(S.coins<1000)return;S.coins-=1000;const rs=[];for(let i=0;i<10;i++)rs.push(pull());
 if(!rs.some(x=>["SR","SSR"].includes(x.c.rar))){const last=rs.pop();S.own[last.c.id]--;if(!S.own[last.c.id])delete S.own[last.c.id];else S.coins-=REFUND[last.c.rar];S.pity--;rs.push(pull(true))}
 showTen(rs);save();hud()};
$("bfree").onclick=()=>{S.coins+=1000;save();hud();toast("코인 1000개를 충전했어요")};

// 도감
const BRANDS=[...new Set(CARS.map(c=>c.brand))];let brand="전체";
function dex(){const own=Object.keys(S.own).length;$("prog").style.width=(own/CARS.length*100)+"%";
 $("brands").innerHTML=["전체",...BRANDS].map(b=>{const L=b==="전체"?CARS:CARS.filter(c=>c.brand===b),h=L.filter(c=>S.own[c.id]).length;
  return `<button class="chip" aria-pressed="${b===brand}" data-b="${esc(b)}">${esc(b)} ${h}/${L.length}</button>`}).join("");
 const list=CARS.filter(c=>brand==="전체"||c.brand===brand);
 $("grid").innerHTML=list.map(c=>{const h=S.own[c.id];return `<div class="slot${h?"":" lock"}">${pic(c,!h)}
  <div class="n">${h?esc(c.name):"???"}</div><div class="m"><span style="color:${gc(c.rar)};font-weight:800">${c.rar}</span><span>${h?c.year+"년 · ×"+h:esc(c.brand)}</span></div></div>`}).join("")}
$("brands").onclick=e=>{const b=e.target.closest("[data-b]");if(b){brand=b.dataset.b;dex()}};
function tab(d){$("t-draw").setAttribute("aria-selected",!d);$("t-dex").setAttribute("aria-selected",d);$("p-draw").hidden=d;$("p-dex").hidden=!d;if(d)dex()}
$("t-draw").onclick=()=>tab(false);$("t-dex").onclick=()=>tab(true);

$("single").innerHTML=`<div class="car">${carSVG(CARS.find(c=>c.type==="sedan"),"#3a3f46")}</div><div class="result"><div class="name">빈 주차칸</div><div class="meta">뽑기 버튼을 눌러 첫 차를 들여보세요</div></div>`;
hud();
</script>
