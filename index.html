<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>카 가챠 차고</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 지하 주차장 B2 — 콘크리트 벽, 스포트라이트, 반사되는 에폭시 바닥. 셔터가 올라가며 차가 굴러 들어옴. 카드 = 한국식 번호판 + 측면 렌더 */
:root{
  --asphalt:#111316; --asphalt-2:#1a1d21; --concrete:#2a2e34; --line:#f2c230; --paint:#ecebe6; --muted:#949aa3;
  --c:#9aa1aa; --r:#3f9bf0; --sr:#b072f5; --ssr:#ffae35; --ur:#ff4d6d;
  --plate:#f6f6f1; --plate-ink:#121212;
  --f-display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--asphalt)}
body{color:var(--paint);font-family:var(--f-body);
  background-image:radial-gradient(ellipse at 50% -10%,#262a31 0,transparent 55%)}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6.5vw,52px);margin:0;line-height:.95;letter-spacing:.01em}
h1 span{color:var(--line)}
.sub{color:var(--muted);font-size:13px;margin-top:8px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--asphalt-2);border:1px solid var(--concrete);border-radius:10px;padding:8px 12px}
.pill small{color:var(--muted);font-size:12px}
.pill b{font:700 18px var(--f-mono);color:var(--line);font-variant-numeric:tabular-nums}
.pill b.pity{color:var(--ssr);font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:2px dashed var(--concrete)}
.tab{background:none;border:0;color:var(--muted);font:800 15px var(--f-body);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--paint);border-color:var(--line)}
button:focus-visible,a:focus-visible{outline:2px solid var(--line);outline-offset:2px}

/* ===== Stage ===== */
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--concrete);background:#0c0e10}
.bay{position:relative;min-height:380px;display:flex;align-items:center;justify-content:center;padding:36px 16px 30px;overflow:hidden;
  background:
   linear-gradient(180deg,#1b1e22 0,#16191c 58%,#0e1012 58.2%,#0b0c0e 100%);}
.bay .wall{position:absolute;inset:0 0 42% 0;background-image:
   repeating-linear-gradient(90deg,transparent 0 119px,#00000040 119px 121px),
   repeating-linear-gradient(0deg,transparent 0 59px,#00000030 59px 60px);opacity:.7}
.bay .sign{position:absolute;top:14px;left:16px;font:700 12px var(--f-mono);color:#1a1a1a;background:var(--line);padding:3px 8px;border-radius:3px;letter-spacing:.1em;z-index:1}
.bay .stripes{position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;
  background:linear-gradient(90deg,transparent 0 9%,var(--line) 9% 10.2%,transparent 10.2% 89.8%,var(--line) 89.8% 91%,transparent 91%);
  -webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%);opacity:.75}
.spot{position:absolute;left:50%;top:-10%;width:120%;height:115%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .5s;
  background:conic-gradient(from 180deg at 50% 0%,transparent 0 160deg,#ffffff1c 172deg,#ffffff26 180deg,#ffffff1c 188deg,transparent 200deg);}
.spot.on{opacity:1}
.aura{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
.aura.beams{background:repeating-conic-gradient(from 0deg at 50% 62%,var(--aura) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle at 50% 62%,#000 0,transparent 60%);mask:radial-gradient(circle at 50% 62%,#000 0,transparent 60%);animation:spin 18s linear infinite}
.aura.rainbow{background:conic-gradient(from 0deg at 50% 62%,#ff4d6d,#ffae35,#f2e94e,#3ee08f,#3f9bf0,#b072f5,#ff4d6d);
  -webkit-mask:radial-gradient(circle at 50% 62%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 62%,#000 0,transparent 55%);animation:spin 6s linear infinite;mix-blend-mode:screen}
@keyframes spin{to{transform:rotate(1turn)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.shutter{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(180deg,#3c4148 0 16px,#30343a 16px 17px,#272a2f 17px 19px),#30343a;
  box-shadow:inset 0 -14px 0 #1c1f23;transition:transform 1s cubic-bezier(.75,0,.2,1)}
.shutter::after{content:"";position:absolute;left:50%;bottom:22px;width:60px;height:10px;transform:translateX(-50%);border-radius:3px;background:#1c1f23;box-shadow:inset 0 2px 0 #00000080}
.shutter span{font:400 20px var(--f-display);color:#d5d8dc;background:#00000066;padding:6px 14px;border-radius:6px;letter-spacing:.08em}
.shutter.up{transform:translateY(-102%)}
.shutter.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.reveal{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%}
.carbox{position:relative;width:min(560px,96%)}
.carbox svg{width:100%;height:auto;display:block}
.carbox .mirror{position:absolute;left:0;right:0;top:100%;transform:scaleY(-1);transform-origin:top;opacity:.18;
  -webkit-mask:linear-gradient(to top,#000 0,transparent 45%);mask:linear-gradient(to top,#000 0,transparent 45%);margin-top:-14%}
.photo{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:#0c0e10}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo svg{position:absolute;inset:0;margin:auto;height:auto}
.carbox .photo{border-radius:12px;border:2px solid var(--rc,var(--concrete));box-shadow:0 18px 40px #000a,0 0 28px color-mix(in srgb,var(--rc,#000) 35%,transparent)}
.carbox .mirror.photo-m{margin-top:6px}
.credit{font-size:11px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.credit a{color:inherit}
.drive{animation:drive 1.1s cubic-bezier(.15,.75,.25,1) both}
@keyframes drive{0%{transform:translateX(-120%) skewX(-6deg);filter:blur(4px)}70%{filter:blur(0)}85%{transform:translateX(2%) skewX(1deg)}100%{transform:none}}
.drive .wheel{animation:roll 1.1s cubic-bezier(.15,.75,.25,1) both}
.wheel{transform-box:fill-box;transform-origin:center}
@keyframes roll{from{transform:rotate(-900deg)}to{transform:rotate(0)}}
.info{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.info .name{font-family:var(--f-display);font-size:clamp(24px,5.5vw,38px);line-height:1.08;text-wrap:balance;max-width:20ch}
.info .eng{font:500 13px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.info .meta{color:var(--muted);font-size:13px}
.fade{animation:fade .6s .7s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f-mono);padding:4px 9px;border-radius:4px;color:#111;letter-spacing:.08em}
.newtag{font:800 11px var(--f-body);color:var(--line);letter-spacing:.12em}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.link{font:600 13px var(--f-body);color:var(--paint);text-decoration:none;border:1px solid var(--concrete);background:#ffffff08;padding:7px 12px;border-radius:8px}
.link:hover{border-color:var(--line);color:var(--line)}

.grid10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:980px}
@media (max-width:700px){.grid10{grid-template-columns:repeat(2,minmax(0,1fr))}}
.controls{display:flex;gap:10px;padding:14px;border-top:1px solid var(--concrete);flex-wrap:wrap;justify-content:center;background:#15171a}
.btn{font:800 15px var(--f-body);border-radius:10px;padding:12px 18px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:140px;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn small{font:500 11px var(--f-mono);opacity:.85}
.btn.primary{background:var(--line);color:#191919}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{border-color:var(--concrete);color:var(--muted);min-width:0}
.odds{display:flex;gap:14px;flex-wrap:wrap;font:500 12px var(--f-mono);color:var(--muted);justify-content:center}
.odds i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.msg{min-height:20px;text-align:center;color:var(--paint);font-size:14px;font-weight:600}
.foot{color:var(--muted);font-size:12px;text-align:center;line-height:1.6}

/* ===== Card ===== */
.card{background:linear-gradient(180deg,#1d2024,#16181b);border:1px solid var(--concrete);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;position:relative;min-width:0;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#454a52}
.card[data-r="SR"]{border-color:color-mix(in srgb,var(--sr) 60%,transparent)}
.card[data-r="SSR"]{border-color:var(--ssr);box-shadow:0 0 16px color-mix(in srgb,var(--ssr) 28%,transparent)}
.card[data-r="UR"]{border:1px solid transparent;background:linear-gradient(180deg,#1d2024,#16181b) padding-box,conic-gradient(#ff4d6d,#ffae35,#f2e94e,#3ee08f,#3f9bf0,#b072f5,#ff4d6d) border-box;box-shadow:0 0 22px color-mix(in srgb,var(--ur) 35%,transparent)}
.card svg{width:100%;height:auto;display:block}
.card .cn{font-weight:800;font-size:13px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.card .cm{font-size:11px;color:var(--muted)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.plate{font:700 12px var(--f-mono);background:var(--plate);color:var(--plate-ink);border:2px solid #1c1c1c;border-radius:4px;text-align:center;padding:1px 4px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px #00000022}
.plate.big{font-size:17px;padding:3px 14px;border-width:3px}
.card.locked{cursor:default}
.card.locked svg{filter:brightness(0) opacity(.5)}
.card.locked .cn{color:var(--muted)}
.count{font:700 11px var(--f-mono);color:var(--muted)}
/* flip for 10-pull */
.flip{perspective:900px;min-width:0}
.flip .inner{position:relative;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;height:100%}
.flip.open .inner{transform:rotateY(180deg)}
.flip .back,.flip .card{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .card{transform:rotateY(180deg);height:100%;width:100%}
.flip .back{position:absolute;inset:0;border-radius:12px;border:1px solid var(--concrete);display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(180deg,#3a3f46 0 10px,#2d3137 10px 12px);font:400 26px var(--f-display);color:#ffffff30}
.flip .back.hint{box-shadow:0 0 0 2px var(--h),0 0 18px var(--h)}

/* ===== Collection ===== */
.panel{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:600 13px var(--f-body);border:1px solid var(--concrete);background:var(--asphalt-2);color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{color:#111;background:var(--paint);border-color:var(--paint)}
.progress{height:10px;background:var(--asphalt-2);border-radius:999px;overflow:hidden;border:1px solid var(--concrete)}
.progress div{height:100%;background:repeating-linear-gradient(45deg,var(--line) 0 10px,#d6a91c 10px 20px);transition:width .4s}
.stats{display:flex;justify-content:space-between;font:500 13px var(--f-mono);color:var(--muted);flex-wrap:wrap;gap:8px}
.stats b{color:var(--paint)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bar.series{padding:10px;border:1px dashed var(--concrete);border-radius:12px}
.bar.series .chip small{font:500 11px var(--f-mono);opacity:.75;margin-left:4px}
.shead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-top:10px;padding-bottom:6px;border-bottom:1px solid var(--concrete)}
.shead:first-child{margin-top:0}
.shead b{font:400 22px var(--f-display);color:var(--paint)}
.shead span{font:500 12px var(--f-mono);color:var(--muted)}
.shead button{margin-left:auto}
@media (max-width:420px){.coll{grid-template-columns:repeat(2,minmax(0,1fr))}}
input[type=search]{background:var(--asphalt-2);border:1px solid var(--concrete);color:var(--paint);border-radius:8px;padding:8px 10px;font:500 14px var(--f-body);flex:1;min-width:140px}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;z-index:20;background:#000000b8;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:#15171a;border:1px solid var(--concrete);border-radius:16px;width:min(620px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative}
.sheet .close{position:absolute;top:10px;right:10px}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.specs div{background:var(--asphalt-2);border:1px solid var(--concrete);border-radius:8px;padding:8px 10px;min-width:0}
.specs small{display:block;color:var(--muted);font-size:11px}
.specs b{font-size:14px}
@media (prefers-reduced-motion:reduce){.shutter,.flip .inner{transition:none}.drive,.drive .wheel,.aura,.fade{animation:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>카 가챠 <span>차고</span></h1>
      <div class="sub">셔터를 올려 오늘의 차를 뽑으세요 · 실차 기준 <span id="carCount">166</span>종</div>
    </div>
    <div class="hud">
      <div class="pill"><small>코인</small><b id="coins">0</b><button class="btn ghost" id="refill" style="padding:5px 9px;font-size:12px" hidden>+1000 충전</button></div>
      <div class="pill"><small>SSR 천장</small><b class="pity" id="pity">0/60</b></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-pull" aria-selected="true">뽑기</button>
    <button class="tab" role="tab" id="tab-coll" aria-selected="false">도감</button>
  </nav>

  <section id="view-pull" class="panel">
    <div class="stage">
      <div class="bay" id="bay">
        <div class="wall"></div><div class="stripes"></div><div class="sign">B2 · 07</div>
        <div class="spot" id="spot"></div>
        <div class="aura" id="aura"></div>
        <canvas class="fx" id="fx"></canvas>
        <div class="reveal" id="reveal"></div>
        <div class="shutter" id="shutter"><span>GARAGE · B2</span></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="pull1">1회 뽑기<small>100 코인</small></button>
        <button class="btn" id="pull10">10연차<small>900 코인 · SR 이상 1대 확정</small></button>
        <button class="btn ghost" id="openAll" hidden>모두 공개</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="odds" id="odds"></div>
    <div class="foot">중복 환급: C 10 · R 20 · SR 50 · SSR 150 · UR 500 코인 · 60회 안에 SSR 이상이 안 나오면 다음 뽑기는 SSR 이상 확정<br>차를 누르면 크게 보고 위키백과 링크를 열 수 있어요 · 차 사진은 위키미디어 커먼즈의 자유 라이선스 사진이에요(저작자 표기는 상세 화면)</div>
  </section>

  <section id="view-coll" class="panel" hidden>
    <div class="stats"><span id="collCount"></span><span id="collRar"></span></div>
    <div class="progress"><div id="prog"></div></div>
    <div class="bar" id="rarFilter"></div>
    <div class="bar" id="ctyFilter"></div>
    <div class="bar series" id="serFilter" hidden></div>
    <div class="bar"><input type="search" id="q" placeholder="보유한 차 이름·브랜드 검색"><button class="chip" id="ownedOnly" aria-pressed="false">보유만</button></div>
    <div class="coll" id="coll"></div>
    <div class="foot"><button class="chip" id="reset">기록 초기화</button> <span id="resetConfirm" hidden>정말 지울까요? <button class="chip" id="resetYes">지우기</button> <button class="chip" id="resetNo">취소</button></span></div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="photos.js"></script>

현대 아반떼 MD|현대|KR|2010|sedan|C|Hyundai Avante MD
현대 아반떼 AD|현대|KR|2015|sedan|C|Hyundai Avante AD
현대 올 뉴 아반떼 (CN7)|현대|KR|2020|sedan|R|Hyundai Avante CN7

현대 디 올 뉴 그랜저 (GN7)|현대|KR|2022|sedan|R|Hyundai Grandeur GN7
현대 캐스퍼|현대|KR|2021|mini|C|Hyundai Casper
현대 투싼 (NX4)|현대|KR|2020|suv|C|Hyundai Tucson NX4
현대 디 올 뉴 싼타페 (MX5)|현대|KR|2023|suv|R|Hyundai Santa Fe MX5
현대 디 올 뉴 팰리세이드 (LX3)|현대|KR|2025|suv|R|Hyundai Palisade LX3
현대 갤로퍼|현대|KR|1991|suv|R|Hyundai Galloper

현대 포터 II|현대|KR|2004|truck|C|Hyundai Porter II

 const hy=s.sh-1, fl=s.front, rl=s.rear;
 const lights=`<path d="M${fl-14} ${hy-1} L${fl-1} ${hy+1} L${fl-2} ${hy+4} L${fl-15} ${hy+3} Z" fill="url(#${id}hl)"/>
   <path d="M${rl+1} ${hy} L${rl+12} ${hy-1} L${rl+12} ${hy+3} L${rl} ${hy+4} Z" fill="#d21f2b"/>`;
 return `<svg viewBox="0 0 244 92" role="img" aria-label="${car.name}">
 <defs>
  <linearGradient id="${id}b" x1="0" y1="${top}" x2="0" y2="72" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${shade(col,.38)}"/><stop offset=".32" stop-color="${col}"/><stop offset=".58" stop-color="${shade(col,.12)}"/><stop offset=".62" stop-color="${shade(col,-.12)}"/><stop offset="1" stop-color="${shade(col,-.55)}"/></linearGradient>
  <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d7487"/><stop offset=".5" stop-color="#1c2833"/><stop offset="1" stop-color="#0a1016"/></linearGradient>
  <linearGradient id="${id}rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f2f5"/><stop offset=".5" stop-color="#8d939b"/><stop offset="1" stop-color="#d7dbe0"/></linearGradient>
  <linearGradient id="${id}hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd8e0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="${id}gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="${id}clip"><path d="${s.b}"/></clipPath>
 </defs>
 <ellipse cx="122" cy="87" rx="112" ry="4.5" fill="#000" opacity=".55"/>
 <ellipse cx="122" cy="86" rx="80" ry="2.5" fill="#000" opacity=".5"/>
 <path d="${s.b}" fill="url(#${id}b)"/>
 <g clip-path="url(#${id}clip)">
  <rect x="0" y="64" width="244" height="10" fill="#000" opacity=".38"/>
  <rect x="0" y="${s.sh-1}" width="244" height="1.4" fill="url(#${id}gl)"/>
  <ellipse cx="110" cy="${top+6}" rx="70" ry="5" fill="#fff" opacity=".12"/>
  ${doors}${bed}${intake}
 </g>
 <path d="${s.g}" fill="url(#${id}g)"/>
 <path d="${s.g}" fill="none" stroke="#000" stroke-opacity=".5" stroke-width=".8"/>
 <path d="M${s.w[0]+30} ${top+4} l26 0 l-14 ${s.sh-top-8} l-26 0 Z" fill="#fff" opacity=".07" clip-path="url(#${id}clip)"/>
 ${lights}
 <path d="${s.b}" fill="none" stroke="#000" stroke-opacity=".45" stroke-width=".8"/>
 ${wheel(s.w[0])}${wheel(s.w[1])}
</svg>`;
}
function plate(car){const h=hash(car.name+"plate");const ko="가나다라마거너더러머버서어저고노도로모보소오조구누두루무부수우주";
 return `${100+h%900}${ko[(h>>>7)%ko.length]} ${String(1000+(h>>>11)%9000)}`;}
const gimg=c=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(c.eng);
const wiki=c=>"https://ko.wikipedia.org/w/index.php?search="+encodeURIComponent(c.name.replace(/\s*\(.*?\)/g,""));
// real photo with the side render as fallback if the image fails to load
function photo(car,cls=""){return `<div class="photo ${cls}"><img src="img/${car.id}.jpg" alt="${car.name}" loading="lazy" decoding="async" onerror="this.parentNode.innerHTML=svgCar(CARS[${car.id}])"></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function credit(car){const p=typeof PHOTO!=="undefined"&&PHOTO[car.id];if(!p)return"";
 if(!p[2])return `<div class="credit">사진: ${esc(p[0])}</div>`;
 return `<div class="credit">사진: ${esc(p[0])} · ${esc(p[1])} · <a href="${esc(p[2])}" target="_blank" rel="noopener">위키미디어 커먼즈 ↗</a></div>`}

// ---------- state ----------
let state={coins:3000,owned:{},pity:0};
try{const s=JSON.parse(localStorage.getItem("carGacha2")||"null");if(s&&typeof s.coins==="number")state=Object.assign(state,s)}catch(e){}
function save(){try{localStorage.setItem("carGacha2",JSON.stringify(state))}catch(e){}}
const $=id=>document.getElementById(id);
function renderHUD(){$("coins").textContent=state.coins.toLocaleString();$("pity").textContent=`${state.pity}/${PITY}`;
 $("pull1").disabled=state.coins<100||busy;$("pull10").disabled=state.coins<900||busy;$("refill").hidden=state.coins>=100}

function rollRarity(min){const pool=RAR.slice(min);const tot=pool.reduce((a,r)=>a+WEIGHT[r],0);let x=Math.random()*tot;for(const r of pool){x-=WEIGHT[r];if(x<0)return r}return pool[pool.length-1]}
function rollOne(min=0){if(state.pity>=PITY-1)min=Math.max(min,3);const r=rollRarity(min);const list=CARS.filter(c=>c.rar===r);const c=list[Math.floor(Math.random()*list.length)];
 state.pity=RAR.indexOf(r)>=3?0:state.pity+1;return c}

function cardHTML(car,o={}){
 const got=state.owned[car.id]||0;const locked=o.coll&&!got;
 return `<button class="card${locked?" locked":""}" data-r="${car.rar}" data-id="${car.id}" ${locked?'disabled aria-label="미보유 차량"':""}>
  <div class="top"><span class="badge" style="background:${rc(car.rar)}">${car.rar}</span>${o.isNew?'<span class="newtag">NEW</span>':o.coll&&got?`<span class="count">×${got}</span>`:o.dup?`<span class="count">+${REFUND[car.rar]}</span>`:""}</div>
  ${locked?svgCar(car):photo(car)}
  <div class="plate">${locked?"??? ????":plate(car)}</div>
  <div class="cn">${locked?"???":car.name}</div>
  <div class="cm">${locked?`${CTY[car.cty]} · ${TYPE[car.type]}`:`${CTY[car.cty]} · ${car.year} · ${TYPE[car.type]}`}</div></button>`;
}

// ---------- fx ----------
const fx=$("fx"),ctx=fx.getContext("2d");let parts=[],raf=0;
function burst(color,n){const r=fx.getBoundingClientRect();fx.width=r.width*devicePixelRatio;fx.height=r.height*devicePixelRatio;
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*7;parts.push({x:fx.width/2,y:fx.height*.6,vx:Math.cos(a)*v*devicePixelRatio,vy:Math.sin(a)*v*devicePixelRatio-3,life:1,c:Array.isArray(color)?color[i%color.length]:color,s:(2+Math.random()*3)*devicePixelRatio})}
 if(!raf)loop()}
function loop(){ctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12*devicePixelRatio;p.vx*=.985;p.life-=.012;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*1.6)}
 raf=parts.length?requestAnimationFrame(loop):0;if(!raf)ctx.clearRect(0,0,fx.width,fx.height)}
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function rarityFx(r){const a=$("aura");a.className="aura";a.style.opacity=0;
 if(r==="SR"){a.classList.add("beams");a.style.setProperty("--aura",css("--sr")+"55");a.style.opacity=.7}
 if(r==="SSR"){a.classList.add("beams");a.style.setProperty("--aura",css("--ssr")+"77");a.style.opacity=1;if(!reduced)burst([css("--ssr"),"#fff3c4"],90)}
 if(r==="UR"){a.classList.add("rainbow");a.style.opacity=.85;if(!reduced){const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");burst(["#ff4d6d","#ffae35","#f2e94e","#3ee08f","#3f9bf0","#b072f5"],180)}}}

// ---------- pull ----------
let busy=false,pending=[],last10=null;
function pull(n){
 if(busy)return;const cost=n===1?100:900;if(state.coins<cost)return;
 busy=true;state.coins-=cost;$("openAll").hidden=true;
 const res=[];for(let i=0;i<n;i++)res.push(rollOne());
 if(n===10&&!res.some(c=>RAR.indexOf(c.rar)>=2)){res[9]=rollOne(2)}
 let refund=0;const items=res.map(c=>{const isNew=!state.owned[c.id];if(!isNew)refund+=REFUND[c.rar];state.owned[c.id]=(state.owned[c.id]||0)+1;return{c,isNew}});
 state.coins+=refund;save();renderHUD();
 const best=res.reduce((a,c)=>RAR.indexOf(c.rar)>RAR.indexOf(a.rar)?c:a);
 const sh=$("shutter");sh.classList.remove("up");$("spot").classList.remove("on");$("aura").style.opacity=0;$("msg").textContent="";
 setTimeout(()=>{
  if(RAR.indexOf(best.rar)>=3){sh.classList.add("shake")}
  setTimeout(()=>{sh.classList.remove("shake");
   if(n===1){const{c,isNew}=items[0];
    $("reveal").innerHTML=`<div class="carbox drive" style="--rc:${rc(c.rar)}">${photo(c)}<div class="mirror photo-m" aria-hidden="true">${photo(c)}</div></div>
     <div class="info fade"><span class="badge" style="background:${rc(c.rar)}">${c.rar} · ${RNAME[c.rar]}</span>
     <div class="name">${c.name}</div><div class="eng">${c.eng}</div>
     <div class="plate big">${plate(c)}</div>
     <div class="meta">${c.brand} · ${CTY[c.cty]} · ${c.year}년 · ${TYPE[c.type]}</div>
     ${isNew?'<div class="newtag">NEW · 도감에 등록됐어요</div>':`<div class="meta">이미 있는 차라 ${REFUND[c.rar]} 코인으로 돌려받았어요</div>`}
     <div class="links"><a class="link" href="${gimg(c)}" target="_blank" rel="noopener">실제 사진 보기 ↗</a><a class="link" href="${wiki(c)}" target="_blank" rel="noopener">위키백과 ↗</a></div></div>`;
    sh.classList.add("up");$("spot").classList.add("on");setTimeout(()=>rarityFx(c.rar),reduced?0:700);
    $("msg").textContent=c.rar==="UR"?"얼티밋 레어! 전설의 차가 들어왔어요":c.rar==="SSR"?"스페셜 레어 등장!":"";
    busy=false;renderHUD();
   }else{
    $("reveal").innerHTML=`<div class="grid10">${items.map(({c,isNew},i)=>`<div class="flip" data-i="${i}"><div class="inner"><div class="back${RAR.indexOf(c.rar)>=3?" hint":""}" style="--h:${rc(c.rar)}">?</div>${cardHTML(c,{isNew,dup:!isNew})}</div></div>`).join("")}</div>`;
    last10=[items,refund,best];
    sh.classList.add("up");$("spot").classList.add("on");$("openAll").hidden=false;
    const flips=[...document.querySelectorAll(".flip")];pending=flips.map((f,i)=>setTimeout(()=>f.classList.add("open"),reduced?0:600+i*170));
    pending.push(setTimeout(()=>finish10(items,refund,best),reduced?0:600+10*170+300));
   }
  },RAR.indexOf(best.rar)>=3?380:0);
 },650);
}
function finish10(items,refund,best){if(!busy)return;last10=null;pending.forEach(clearTimeout);pending=[];document.querySelectorAll(".flip").forEach(f=>f.classList.add("open"));$("openAll").hidden=true;
 rarityFx(best.rar);const nNew=items.filter(i=>i.isNew).length;
 $("msg").textContent=`새 차 ${nNew}대${refund?` · 중복 환급 +${refund} 코인`:""}${best.rar==="UR"?" · 얼티밋 레어 등장!":best.rar==="SSR"?" · 스페셜 레어 등장!":""}`;busy=false;renderHUD()}
$("openAll").onclick=()=>{if(last10)finish10(...last10)};

// ---------- modal ----------
function openModal(id){const c=CARS[id];if(!state.owned[id])return;
 $("sheet").innerHTML=`<button class="btn ghost close" id="mclose">닫기</button>
  <span class="badge" style="background:${rc(c.rar)};align-self:flex-start">${c.rar} · ${RNAME[c.rar]}</span>
  <div style="font:400 clamp(24px,5vw,34px) var(--f-display);line-height:1.1;padding-right:70px">${c.name}</div>
  <div class="eng" style="font:500 13px var(--f-mono);color:var(--muted);margin-top:-8px">${c.eng}</div>
  <div class="carbox" style="width:100%;--rc:${rc(c.rar)}">${photo(c)}</div>
  ${credit(c)}
  <div class="plate big" style="align-self:center">${plate(c)}</div>
  <div class="specs"><div><small>브랜드</small><b>${c.brand}</b></div><div><small>국가</small><b>${CTY[c.cty]}</b></div><div><small>출시</small><b>${c.year}년</b></div><div><small>차종</small><b>${TYPE[c.type]}</b></div></div>
  <div class="links" style="justify-content:flex-start"><a class="link" href="${gimg(c)}" target="_blank" rel="noopener">실제 사진 보기 ↗</a><a class="link" href="${wiki(c)}" target="_blank" rel="noopener">위키백과 ↗</a></div>
  <div class="foot" style="text-align:left">보유 ${state.owned[id]}대</div>`;
 $("modal").hidden=false;$("mclose").focus();$("mclose").onclick=()=>$("modal").hidden=true}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").hidden=true});
document.addEventListener("click",e=>{const c=e.target.closest(".card[data-id]");if(c&&!c.disabled){const f=c.closest(".flip");if(f&&!f.classList.contains("open"))return;openModal(+c.dataset.id)}});

// ---------- collection ----------
// series = model line (아반떼, 쏘나타, K5 …): name minus brand, trim words like "더 뉴" and generation codes in parens
const SERIES_FIX={"현대 엘란트라 (J1)":"아반떼","토요타 GR 수프라":"수프라","닛산 스카이라인 GT-R (R34)":"GT-R","메르세데스-벤츠 300 SL 걸윙":"300 SL",
 "메르세데스-AMG GT":"AMG GT","현대 N 비전 74":"N 비전 74","토요타 스프린터 트레노 AE86":"AE86","르노 그랑 콜레오스":"그랑 콜레오스","아우디 RS 6 아반트":"RS 6","폴스타 2":"폴스타 2","BYD 아토 3":"아토 3","닛산 페어레이디 Z (RZ34)":"페어레이디 Z","현대 그랜드 스타렉스":"스타렉스","제네시스 EQ900":"G90","대우 로얄 살롱":"로얄 살롱"};
function seriesOf(c){if(SERIES_FIX[c.name])return SERIES_FIX[c.name];
 let n=c.name.replace(/\s*\(.*?\)/g,"");
 if(n.startsWith(c.brand+" "))n=n.slice(c.brand.length+1);
 n=n.replace(/^(디 올 뉴|올 뉴|더 뉴)\s/,"");
 const w=n.split(" ");return /^(아이오닉|모델)$/.test(w[0])&&w[1]?w[0]+" "+w[1]:w[0]}
CARS.forEach(c=>c.ser=seriesOf(c));
let fR="ALL",fC="ALL",fS="ALL",ownedOnly=false;
function chips(el,vals,cur,set){el.innerHTML=vals.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join("");el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;set(b.dataset.v);renderColl()}}
function renderColl(){
 const ownedN=CARS.filter(c=>state.owned[c.id]).length;
 $("collCount").innerHTML=`수집 <b>${ownedN}</b> / ${CARS.length}대 (${Math.floor(ownedN/CARS.length*100)}%)`;
 $("collRar").textContent=RAR.map(r=>`${r} ${CARS.filter(c=>c.rar===r&&state.owned[c.id]).length}/${CARS.filter(c=>c.rar===r).length}`).join("  ");
 $("prog").style.width=(ownedN/CARS.length*100)+"%";
 chips($("rarFilter"),[["ALL","전체 등급"],...RAR.map(r=>[r,`${r} ${RNAME[r]}`])],fR,v=>fR=v);
 chips($("ctyFilter"),[["ALL","전체 국가"],...Object.entries(CTY)],fC,v=>{fC=v;fS="ALL"});
 // series chips only inside one country, grouped brand by brand (later-added cars join their brand's block)
 const inC=CARS.filter(c=>c.cty===fC),bOrd=[...new Set(inC.map(c=>c.brand))];
 const sers=fC==="ALL"?[]:[...new Set(inC.map(c=>c.ser))].sort((a,b)=>{const fa=inC.find(c=>c.ser===a),fb=inC.find(c=>c.ser===b);return bOrd.indexOf(fa.brand)-bOrd.indexOf(fb.brand)||fa.id-fb.id});
 if(!sers.includes(fS))fS="ALL";
 $("serFilter").hidden=!sers.length;
 if(sers.length){const cnt=s=>{const a=CARS.filter(c=>c.cty===fC&&c.ser===s);return`${a.filter(c=>state.owned[c.id]).length}/${a.length}`};
  chips($("serFilter"),[["ALL","전체 시리즈"],...sers.map(s=>[s,`${s}<small>${cnt(s)}</small>`])],fS,v=>fS=v)}
 const q=$("q").value.trim().toLowerCase();
 const list=CARS.filter(c=>(fR==="ALL"||c.rar===fR)&&(fC==="ALL"||c.cty===fC)&&(fS==="ALL"||c.ser===fS)&&(!ownedOnly||state.owned[c.id])&&(!q||(state.owned[c.id]&&(c.name+c.brand+c.eng).toLowerCase().includes(q))));
 if(!list.length){$("coll").innerHTML=`<div class="foot" style="grid-column:1/-1">조건에 맞는 차가 없어요</div>`;return}
 if(fC==="ALL"){$("coll").innerHTML=list.map(c=>cardHTML(c,{coll:true})).join("");return}
 // inside a country: one section per series, oldest generation first
 const groups=new Map(sers.map(s=>[s,[]]));list.forEach(c=>groups.get(c.ser).push(c));[...groups].forEach(([s,cs])=>{if(!cs.length)groups.delete(s)});
 $("coll").innerHTML=[...groups].map(([s,cs])=>{const all=CARS.filter(c=>c.cty===fC&&c.ser===s);
  return `<div class="shead"><b>${s}</b><span>${cs[0].brand} · ${all.filter(c=>state.owned[c.id]).length}/${all.length}대</span>${fS==="ALL"&&all.length>1?`<button class="chip" data-ser="${s}">이 시리즈만</button>`:""}</div>`+
   cs.sort((a,b)=>a.year-b.year).map(c=>cardHTML(c,{coll:true})).join("")}).join("");
}
$("q").oninput=renderColl;
$("coll").addEventListener("click",e=>{const b=e.target.closest("[data-ser]");if(b){fS=b.dataset.ser;renderColl()}});
$("ownedOnly").onclick=e=>{ownedOnly=!ownedOnly;e.currentTarget.setAttribute("aria-pressed",ownedOnly);renderColl()};
$("reset").onclick=()=>$("resetConfirm").hidden=false;
$("resetNo").onclick=()=>$("resetConfirm").hidden=true;
$("resetYes").onclick=()=>{state={coins:3000,owned:{},pity:0};save();$("resetConfirm").hidden=true;renderHUD();renderColl()};

function tab(which){const p=which==="pull";$("tab-pull").setAttribute("aria-selected",p);$("tab-coll").setAttribute("aria-selected",!p);$("view-pull").hidden=!p;$("view-coll").hidden=p;if(!p)renderColl()}
$("tab-pull").onclick=()=>tab("pull");$("tab-coll").onclick=()=>tab("coll");
$("pull1").onclick=()=>pull(1);$("pull10").onclick=()=>pull(10);
$("refill").onclick=()=>{state.coins+=1000;save();renderHUD()};

const tot=Object.values(WEIGHT).reduce((a,b)=>a+b,0);
$("odds").innerHTML=RAR.map(r=>`<span><i style="background:${rc(r)}"></i>${r} ${(WEIGHT[r]/tot*100).toFixed(0)}% · ${CARS.filter(c=>c.rar===r).length}종</span>`).join("");
// opening frame: the newest Avante parked behind a half-open view
const sample=CARS.find(c=>c.name==="현대 디 올 뉴 아반떼");
$("reveal").innerHTML=`<div class="carbox" style="opacity:.25">${svgCar(sample)}</div><div class="info"><div class="meta">뽑기 버튼을 누르면 셔터가 올라가요</div></div>`;
$("carCount").textContent=CARS.length;
renderHUD();
</script>

</body></html>
